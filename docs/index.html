<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="One quote about overcoming, every day. It changes at midnight.">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Quotes">
  <meta property="og:description" content="One quote about overcoming, every day. It changes at midnight.">
  <meta property="og:type" content="website">
  <title>Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@700&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=a33d1eb524bf">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main>
    <figure class="quote" id="quote" data-state="loading" aria-live="polite" aria-busy="true">
      <blockquote><p id="quote-text"></p></blockquote>
      <figcaption id="quote-author"></figcaption>
    </figure>
    <noscript>
      <figure class="quote" data-state="ready">
        <blockquote><p>Fall seven times, stand up eight.</p></blockquote>
        <figcaption>Japanese Proverb</figcaption>
      </figure>
    </noscript>
  </main>
  <button class="day-counter" id="day-counter" type="button" hidden aria-haspopup="dialog" aria-controls="archive"></button>
  <dialog class="archive" id="archive" aria-labelledby="archive-title">
    <header class="archive-head">
      <h2 id="archive-title">Every day so far</h2>
      <button class="archive-close" id="archive-close" type="button" aria-label="Close">&times;</button>
    </header>
    <ol class="archive-list" id="archive-list"></ol>
  </dialog>
  <script type="module" src="app.js?v=a33d1eb524bf"></script>
</body>
</html>
